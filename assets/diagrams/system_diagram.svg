<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#294766"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#10203d}.title{font-size:38px;font-weight:800}.subtitle{font-size:18px;fill:#53627c}
      .box{fill:#fff;stroke-width:2;filter:url(#shadow)}.heading{font-size:23px;font-weight:750;text-anchor:middle}.body{font-size:17px;text-anchor:middle}.small{font-size:15px;fill:#596985;text-anchor:middle}
      .flow{fill:none;stroke:#294766;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.flow-label{font-size:15px;fill:#52627d;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="57" class="title" text-anchor="middle">STUDENT MANAGEMENT SYSTEM</text>
  <text x="800" y="90" class="subtitle" text-anchor="middle">System Architecture — Python console application with custom data structures</text>

  <!-- Users -->
  <rect x="55" y="150" width="280" height="700" rx="25" fill="#f3f8ff" stroke="#3275c5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="150" width="280" height="70" rx="25" fill="#316db5"/><path d="M55 190H335V220H55Z" fill="#316db5"/>
  <text x="195" y="195" font-size="24" font-weight="750" fill="#fff" text-anchor="middle">SYSTEM USERS</text>
  <rect x="85" y="260" width="220" height="100" rx="17" fill="#e9f8ef" stroke="#2f8d57"/><text x="195" y="300" class="heading" font-size="20">Administrator</text><text x="195" y="330" class="small">All management functions</text>
  <rect x="85" y="390" width="220" height="100" rx="17" fill="#eaf3ff" stroke="#3275c5"/><text x="195" y="430" class="heading" font-size="20">Teacher</text><text x="195" y="460" class="small">Records, enrollment, scores</text>
  <rect x="85" y="520" width="220" height="100" rx="17" fill="#f3edff" stroke="#7952bf"/><text x="195" y="560" class="heading" font-size="20">Student</text><text x="195" y="590" class="small">Information, courses, GPA</text>
  <rect x="85" y="650" width="220" height="100" rx="17" fill="#fff1e6" stroke="#dd741d"/><text x="195" y="690" class="heading" font-size="20">Parent</text><text x="195" y="720" class="small">Student information and GPA</text>
  <text x="195" y="800" class="small">Role-based access after login</text>

  <!-- Application -->
  <rect x="450" y="135" width="430" height="185" rx="24" class="box" stroke="#4976ae"/>
  <text x="665" y="180" class="heading">Console Interface</text><text x="665" y="215" class="body">main.py</text>
  <text x="665" y="255" class="small">Login and role menus</text><text x="665" y="284" class="small">Keyboard input • formatted output • errors</text>

  <rect x="450" y="400" width="430" height="255" rx="24" class="box" stroke="#2f8d57"/>
  <text x="665" y="447" class="heading">StudentManagementSystem</text><text x="665" y="480" class="body">student_management.py</text>
  <text x="665" y="524" class="small">Authentication and input validation</text><text x="665" y="556" class="small">Student and course CRUD / searching</text><text x="665" y="588" class="small">Enrollment, scores, reports and GPA</text><text x="665" y="620" class="small">Coordinates structures and persistence</text>

  <path d="M335 230H430V225H450" class="flow"/><text x="390" y="213" class="flow-label">interact</text>
  <path d="M665 320V380" class="flow"/><text x="704" y="355" class="flow-label">calls</text>

  <!-- Custom data structures -->
  <rect x="990" y="125" width="555" height="650" rx="26" fill="#faf8ff" stroke="#7351bd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1268" y="172" class="heading">CUSTOM DATA STRUCTURES</text>

  <rect x="1030" y="215" width="475" height="145" rx="20" class="box" stroke="#3275c5"/>
  <text x="1268" y="257" class="heading">Hash Tables</text><text x="1268" y="293" class="body">students • courses • users</text><text x="1268" y="330" class="small">Array of buckets with separate chaining</text>

  <rect x="1030" y="400" width="475" height="145" rx="20" class="box" stroke="#2f8d57"/>
  <text x="1268" y="442" class="heading">Enrollment Graph</text><text x="1268" y="478" class="body">student ↔ course</text><text x="1268" y="515" class="small">Undirected graph stored as adjacency lists</text>

  <rect x="1030" y="585" width="475" height="150" rx="20" class="box" stroke="#dd9416"/>
  <text x="1268" y="627" class="heading">Grade Decision Tree</text><text x="1268" y="663" class="body">score → A / B / C / D / F</text><text x="1268" y="696" class="small">Thresholds: 90 • 80 • 70 • 60</text><text x="1268" y="720" class="small">Returns letter grade and GPA value</text>

  <path d="M880 525H970" class="flow"/><text x="925" y="507" class="flow-label">uses</text>

  <!-- Persistence -->
  <rect x="450" y="760" width="430" height="170" rx="24" class="box" stroke="#dd9416"/>
  <text x="665" y="805" class="heading">Persistent Data File</text><text x="665" y="840" class="body">data.py</text>
  <text x="665" y="878" class="small">USERS • STUDENTS • COURSES</text><text x="665" y="907" class="small">ENROLLMENTS • SCORES</text>

  <path d="M585 655V740" class="flow"/><text x="526" y="704" class="flow-label">save changes</text>
  <path d="M745 760V675" class="flow dash"/><text x="806" y="717" class="flow-label">load at startup</text>

  <!-- Summary -->
  <rect x="990" y="815" width="555" height="115" rx="22" fill="#eef4fb" stroke="#9eafc4"/>
  <text x="1268" y="856" class="heading" font-size="20">RUNTIME FLOW</text>
  <text x="1268" y="895" class="body">Users → Console → Coordinator → Structures → Result</text>
</svg>
